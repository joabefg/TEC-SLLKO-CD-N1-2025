version: '3.7'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      # Configuração básica do ZooKeeper
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper # Garante que o ZooKeeper suba primeiro
    ports:
      - "9092:9092" # Porta para acesso externo
    environment:
      # Configuração essencial do Broker Kafka
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # Conecta ao ZooKeeper pelo nome do serviço
      
      # Configurações de Listeners (Como o Kafka se comunica)
      # PLAINTEXT://kafka:29092 -> Para comunicação interna entre containers
      # PLAINTEXT_HOST://localhost:9092 -> Para comunicação da sua máquina (host)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

# TERMINAL A
#      docker-compose exec kafka kafka-topics --create --topic meu-primeiro-topico --bootstrap-server localhost:9092 --partitions 1 --replication-factor 1
# TERMINAL B
#      docker-compose exec kafka kafka-console-consumer --topic meu-primeiro-topico --bootstrap-server localhost:9092 --from-beginning
# TERMINAL C
#      docker-compose exec kafka kafka-console-producer --topic meu-primeiro-topico --bootstrap-server localhost:9092